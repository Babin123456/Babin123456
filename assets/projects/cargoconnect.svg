<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -12 800 344" width="800" height="344">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#EF4444" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#EF4444" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1" keyTimes="0; 0.5; 1" />
    
    <!-- Base Card Container -->
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#cardBg)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#grid)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#glowTopRight)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

    <!-- Top Badge / Category -->
    <g transform="translate(560, 24)">
      <rect width="196" height="26" rx="13" fill="rgba(255, 255, 255, 0.05)" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.5"/>
      <text x="98" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="1">LOGISTICS &amp; SAAS</text>
    </g>

    <!-- Project Icon Badge -->
    <g transform="translate(44, 28)">
      <rect width="56" height="56" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      
            <rect x="14" y="20" width="18" height="14" rx="2" stroke="url(#accentGrad)" stroke-width="2.5" fill="none"/>
            <path d="M32 24 L40 24 L44 28 L44 34 L32 34 Z" stroke="url(#accentGrad)" stroke-width="2.5" fill="none"/>
            <circle cx="20" cy="35" r="3" fill="#F59E0B"/>
            <circle cx="38" cy="35" r="3" fill="#EF4444"/>
            <line x1="12" y1="24" x2="8" y2="24" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="28" x2="6" y2="28" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
        
    </g>

    <!-- GitHub View Indicator -->
    <g transform="translate(116, 42)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.5">GITHUB REPOSITORY</text>
      <text x="140" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#F59E0B">↗</text>
    </g>

    <!-- Main Title -->
    <text x="44" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">CargoConnect</text>

    <!-- Tagline -->
    <text x="44" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#F59E0B">India's Premier Logistics &amp; Freight Booking Platform</text>

    <!-- Highlights line -->
    <g transform="translate(44, 204)">
      <circle cx="5" cy="-5" r="3" fill="#F59E0B"/>
      <text x="16" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">Instant Vehicle Quoting • Automated PDF Invoicing • Serverless</text>
    </g>

    <!-- Divider -->
    <line x1="44" y1="236" x2="756" y2="236" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Tech Stack Pills -->
    
      <g transform="translate(44, 260)">
        <rect width="88" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">React 18</text>
      </g>
    
      <g transform="translate(142, 260)">
        <rect width="104" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">TypeScript</text>
      </g>
    
      <g transform="translate(256, 260)">
        <rect width="76" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Vite</text>
      </g>
    
      <g transform="translate(342, 260)">
        <rect width="112" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">TailwindCSS</text>
      </g>
    
      <g transform="translate(464, 260)">
        <rect width="104" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Nodemailer</text>
      </g>
    
  </g>
</svg>
