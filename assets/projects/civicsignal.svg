<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -12 800 344" width="800" height="344">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#F43F5E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#F43F5E" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1" keyTimes="0; 0.5; 1" />
    
    <!-- Base Card Container -->
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#cardBg)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#grid)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#glowTopRight)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

    <!-- Top Badge / Category -->
    <g transform="translate(560, 24)">
      <rect width="196" height="26" rx="13" fill="rgba(255, 255, 255, 0.05)" stroke="#EF4444" stroke-width="1" stroke-opacity="0.5"/>
      <text x="98" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#EF4444" text-anchor="middle" letter-spacing="1">COMPUTER VISION &amp; AI</text>
    </g>

    <!-- Project Icon Badge -->
    <g transform="translate(44, 28)">
      <rect width="56" height="56" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      
            <circle cx="28" cy="26" r="14" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="4 2" fill="none"/>
            <circle cx="28" cy="26" r="8" stroke="url(#accentGrad)" stroke-width="2" fill="none"/>
            <circle cx="28" cy="26" r="3.5" fill="#EF4444"/>
            <path d="M28 12 L28 8 M28 44 L28 40 M14 26 L10 26 M46 26 L42 26" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
        
    </g>

    <!-- GitHub View Indicator -->
    <g transform="translate(116, 42)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.5">GITHUB REPOSITORY</text>
      <text x="140" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#EF4444">↗</text>
    </g>

    <!-- Main Title -->
    <text x="44" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">CivicSignal AI</text>

    <!-- Tagline -->
    <text x="44" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#EF4444">Autonomous Multi-Modal AI &amp; Geospatial Civic Triage</text>

    <!-- Highlights line -->
    <g transform="translate(44, 204)">
      <circle cx="5" cy="-5" r="3" fill="#EF4444"/>
      <text x="16" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">YOLO Road Hazard Detection • Zero-Shot NLP • 2dsphere Mapping</text>
    </g>

    <!-- Divider -->
    <line x1="44" y1="236" x2="756" y2="236" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Tech Stack Pills -->
    
      <g transform="translate(44, 260)">
        <rect width="80" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">FastAPI</text>
      </g>
    
      <g transform="translate(134, 260)">
        <rect width="76" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Python</text>
      </g>
    
      <g transform="translate(220, 260)">
        <rect width="112" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">YOLO Vision</text>
      </g>
    
      <g transform="translate(342, 260)">
        <rect width="128" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">MongoDB Atlas</text>
      </g>
    
      <g transform="translate(480, 260)">
        <rect width="76" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Docker</text>
      </g>
    
  </g>
</svg>
