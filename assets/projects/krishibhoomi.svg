<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 -12 800 344" width="800" height="344">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0A0F1D"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#84CC16" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#84CC16"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#84CC16" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines="0.5 0 0.5 1; 0.5 0 0.5 1" keyTimes="0; 0.5; 1" />
    
    <!-- Base Card Container -->
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#cardBg)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#grid)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="url(#glowTopRight)"/>
    <rect x="8" y="0" width="784" height="320" rx="16" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

    <!-- Top Badge / Category -->
    <g transform="translate(560, 24)">
      <rect width="196" height="26" rx="13" fill="rgba(255, 255, 255, 0.05)" stroke="#10B981" stroke-width="1" stroke-opacity="0.5"/>
      <text x="98" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="1">AGRI-TECH &amp; AI</text>
    </g>

    <!-- Project Icon Badge -->
    <g transform="translate(44, 28)">
      <rect width="56" height="56" rx="14" fill="rgba(255, 255, 255, 0.04)" stroke="url(#accentGrad)" stroke-width="1.8"/>
      
            <path d="M28 38 C28 26, 38 20, 42 16 C42 24, 38 34, 28 38 Z" stroke="url(#accentGrad)" stroke-width="2" fill="none"/>
            <path d="M28 38 C28 28, 18 22, 14 18 C14 26, 18 34, 28 38 Z" stroke="url(#accentGrad)" stroke-width="2" fill="none"/>
            <line x1="28" y1="38" x2="28" y2="18" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
        
    </g>

    <!-- GitHub View Indicator -->
    <g transform="translate(116, 42)">
      <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="0.5">GITHUB REPOSITORY</text>
      <text x="140" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#10B981">↗</text>
    </g>

    <!-- Main Title -->
    <text x="44" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">KrishiBhoomi AI</text>

    <!-- Tagline -->
    <text x="44" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#10B981">Production-Quality AI Agriculture Intelligence Platform</text>

    <!-- Highlights line -->
    <g transform="translate(44, 204)">
      <circle cx="5" cy="-5" r="3" fill="#10B981"/>
      <text x="16" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#94A3B8">XGBoost Crop Advisory • CNN Leaf Diagnosis • Voice in 11 Langs</text>
    </g>

    <!-- Divider -->
    <line x1="44" y1="236" x2="756" y2="236" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

    <!-- Tech Stack Pills -->
    
      <g transform="translate(44, 260)">
        <rect width="104" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Next.js 15</text>
      </g>
    
      <g transform="translate(158, 260)">
        <rect width="80" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">FastAPI</text>
      </g>
    
      <g transform="translate(248, 260)">
        <rect width="80" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">XGBoost</text>
      </g>
    
      <g transform="translate(338, 260)">
        <rect width="104" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">PostgreSQL</text>
      </g>
    
      <g transform="translate(452, 260)">
        <rect width="96" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.14)" stroke-width="1"/>
        <circle cx="12" cy="14" r="3.5" fill="url(#accentGrad)"/>
        <text x="22" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Gemini AI</text>
      </g>
    
  </g>
</svg>
